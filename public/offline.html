<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>全球风能锂电人才搜索雷达 — 离线模式</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    .icon { font-size: 48px; margin-bottom: 16px; }
    h1 { font-size: 20px; font-weight: 600; color: #f1f5f9; margin-bottom: 8px; }
    p { font-size: 14px; color: #94a3b8; line-height: 1.6; margin-bottom: 20px; }
    .tip {
      background: #0ea5e9/10;
      border: 1px solid #0ea5e9/30;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 13px;
      color: #7dd3fc;
      margin-bottom: 20px;
    }
    button {
      background: #0ea5e9;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 24px;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #0284c7; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">⚡</div>
    <h1>当前处于离线状态</h1>
    <p>「全球风能锂电人才搜索雷达」需要网络连接才能加载最新数据。</p>
    <div class="tip">💡 提示：部分页面已缓存，登录后可查看已加载的数据。</div>
    <button onclick="location.reload()">重新连接</button>
  </div>
  <script>
    // 自动检测网络恢复
    window.addEventListener('online', () => location.reload());
  </script>
</body>
</html>
